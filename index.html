<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-text">minimal library.</div>
      <button class="add-btn">+ Add book</button>
    </div>

    <!-- Content -->
    <!-- <div class="content"> -->
    <!--   <div class="book"> -->
    <!--     <div class="book-header">Harry Potter and the Philosopher's Stone</div> -->
    <!--     <div class="book-auther">J.K. Rowling</div> -->
    <!--     <div class="book-pages">223</div> -->
    <!--   </div> -->
    <!-- </div> -->


    <!-- Form -->
    <div class="form">
      <h2>Add new book</h2>
      <form action="">
        <div class="form-group">
          <label for="">Title</label>
          <input type="text" class="title" required placeholder="Enter title here">
        </div>
        <div class="form-group">
          <label for="">Author</label>
          <input type="text" class="author" required placeholder="Enter author name here">
        </div>
        <div class="form-group">
          <label for="">Pages</label>
          <input type="text" class="title" required placeholder="Enter number of pages here">
        </div>
        <div class="form-group">
          <label for="">Cover Image URL (Optional)</label>
          <input type="text" class="title" required placeholder="Enter title here">
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" class="is-read">
          <label for="is-read">I have read this book</label>
        </div>
        <div class="form-action">
          <button type="button" class="cancel-btn">Cancel</button>
          <button type="button" class="summit-btn">Summit</button>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="footer">Made by @Retsene</div>
  </div>
  <script src="script.js"></script>
</body>

</html>
